  /api/me/bookshelf/:
    get:
      operationId: me_bookshelf_list
      parameters:
      - in: query
        name: is_favorite
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - dropped
          - reading
          - want_to_read
        description: |-
          * `want_to_read` - Want to Read
          * `reading` - Reading
          * `completed` - Completed
          * `dropped` - Dropped
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookshelfEntryList'
          description: ''
    post:
